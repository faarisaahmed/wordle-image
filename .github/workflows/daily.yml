name: Update daily Wordle data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_daily.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update daily Wordle data"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
